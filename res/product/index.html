<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高端商务价格表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Arial', sans-serif;
        }
        .price-table {
            margin: 50px auto;
            max-width: 1200px;
        }
        .price-card {
            background-color: white;
            border-radius: 12px;
            transition: transform 0.3s ease;
            overflow: hidden;
            margin-bottom: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .price-card:hover {
            transform: scale(1.05);
        }
        .price-header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .price-body {
            padding: 25px;
        }
        .price-tag {
            font-size: 2.5rem;
            font-weight: bold;
            color: #3498db;
        }
        .feature-list {
            list-style-type: none;
            padding: 0;
        }
        .feature-list li {
            padding: 10px 0;
            border-bottom: 1px solid #ecf0f1;
        }
        .btn-purchase {
            width: 100%;
            background-color: #2c3e50;
            color: white;
            border: none;
        }
        
        /* Additional Responsive Tweaks */
        @media (max-width: 768px) {
            .price-table {
                margin: 20px 10px;
            }
            .price-card {
                margin-bottom: 15px;
            }
            .price-tag {
                font-size: 2rem;
            }
            .feature-list li {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row price-table justify-content-center">
            <div class="col-12 col-md-6 col-lg-3">
                <div class="price-card">
                    <div class="price-header">
                        <h3>基础套餐</h3>
                    </div>
                    <div class="price-body text-center">
                        <div class="price-tag mb-3">¥100起</div>
                        <ul class="feature-list">
                            <li>模板修改</li>
                            <li>速度最快</li>
                            <li>标准样式</li>
                        </ul>
                        <a href="#" class="btn btn-purchase mt-3" onclick="contactSales('基础套餐')">立即咨询</a>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="price-card">
                    <div class="price-header">
                        <h3>专业套餐</h3>
                    </div>
                    <div class="price-body text-center">
                        <div class="price-tag mb-3">¥500起</div>
                        <ul class="feature-list">
                            <li>模版重修</li>
                            <li>功能定制</li>
                            <li>专属客服</li>
                            <li>官网定制</li>
                        </ul>
                        <a href="#" class="btn btn-purchase mt-3" onclick="contactSales('专业套餐')">立即咨询</a>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="price-card">
                    <div class="price-header">
                        <h3>企业套餐</h3>
                    </div>
                    <div class="price-body text-center">
                        <div class="price-tag mb-3">¥1000起</div>
                        <ul class="feature-list">
                            <li>全面设计</li>
                            <li>高度自定义</li>
                            <li>专属团队</li>
                            <li>AI智能预测</li>
                            <li>优先选择</li>
                        </ul>
                        <a href="#" class="btn btn-purchase mt-3" onclick="contactSales('企业套餐')">立即咨询</a>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="price-card">
                    <div class="price-header">
                        <h3>定制套餐</h3>
                    </div>
                    <div class="price-body text-center">
                        <div class="price-tag mb-3">联系洽谈</div>
                        <ul class="feature-list">
                            <li>完全个性化方案</li>
                            <li>专属需求对接</li>
                            <li>灵活服务范围</li>
                            <li>十对一服务</li>
                            <li>高级定制支持</li>
                        </ul>
                        <a href="#" class="btn btn-purchase mt-3" onclick="contactSales('定制套餐')">联系我们</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function contactSales(packageName) {
            // 这是一个示例联系方式，实际情况可以根据需求修改
            const contactInfo = {
                '基础套餐': 'tel:+86-18245944102',
                '专业套餐': 'mailto:EMOBro@qq.com?subject=你好，我要咨询专业套餐',
                '企业套餐': 'mailto:ChineseHi@outlook.com?subject=你好，我要咨询企业套餐',
                '定制套餐': '../contact/'
            };
            
            const contact = contactInfo[packageName] || 'tel:+86-10-12345678';
            window.open(contact, '_blank');
        }
    </script>
</body>
</html>
